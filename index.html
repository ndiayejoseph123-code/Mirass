```html
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Générateur de Fiches Pédagogiques CE2 (CEB)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @media print {
      .no-print { display: none !important; }
      body { background: white !important; padding: 0 !important; }
      .sheet { border: none !important; box-shadow: none !important; margin: 0 !important; width: 100% !important; padding: 0 !important; }
    }
  </style>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800 font-sans p-4 md:p-8">

  <div class="max-w-4xl mx-auto">
    <!-- En-tête -->
    <header class="text-center mb-8 no-print">
      <h1 class="text-3xl font-bold text-blue-900 mb-2">Générateur de Fiches Pédagogiques CE2</h1>
      <p class="text-gray-600">Conforme au Curriculum de l'Éducation de Base (CEB)</p>
    </header>

    <!-- Formulaire de saisie -->
    <div class="bg-white p-6 rounded-xl shadow-md mb-8 no-print">
      <form id="ficheForm" class="space-y-4">
        <div>
          <label for="prompt" class="block font-semibold text-gray-700 mb-1">Titre de la leçon / Sujet :</label>
          <input type="text" id="prompt" placeholder="Ex: Ordre des termes d'une phrase, Le m et ses sous multiples..." 
            class="w-full border border-gray-300 rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-blue-600" required>
        </div>
        <button type="submit" id="submitBtn" 
          class="w-full bg-blue-700 hover:bg-blue-800 text-white font-bold py-3 rounded-lg transition duration-200 flex justify-center items-center gap-2">
          <span>Générer la fiche pédagogique</span>
        </button>
      </form>
    </div>

    <!-- Indicateur de chargement -->
    <div id="loading" class="hidden text-center py-12 no-print">
      <div class="inline-block animate-spin rounded-full h-12 w-12 border-4 border-blue-700 border-t-transparent mb-4"></div>
      <p class="text-gray-600 font-medium">Génération de la fiche CEB en cours...</p>
    </div>

    <!-- Zone d'erreur -->
    <div id="errorBox" class="hidden bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded-lg mb-6 no-print"></div>

    <!-- Zone d'affichage de la fiche -->
    <div id="outputContainer" class="hidden space-y-4">
      <div class="flex justify-end gap-3 no-print">
        <button onclick="copyContent()" class="bg-gray-600 hover:bg-gray-700 text-white text-sm px-4 py-2 rounded-lg font-medium">Copier le texte brut</button>
        <button onclick="window.print()" class="bg-green-700 hover:bg-green-800 text-white text-sm px-4 py-2 rounded-lg font-medium">Imprimer / Exporter PDF</button>
      </div>

      <div id="ficheSheet" class="sheet bg-white p-8 rounded-xl shadow-lg border border-gray-200">
        <!-- Le contenu de la fiche s'affiche ici -->
      </div>
    </div>
  </div>

  <script>
    document.getElementById('ficheForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const promptInput = document.getElementById('prompt').value.trim();
      if (!promptInput) return;

      const submitBtn = document.getElementById('submitBtn');
      const loading = document.getElementById('loading');
      const errorBox = document.getElementById('errorBox');
      const outputContainer = document.getElementById('outputContainer');

      errorBox.classList.add('hidden');
      outputContainer.classList.add('hidden');
      loading.classList.remove('hidden');
      submitBtn.disabled = true;

      try {
        const response = await fetch('/.netlify/functions/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt: promptInput })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || 'Erreur lors de la génération');
        }

        renderFiche(data.text);
        outputContainer.classList.remove('hidden');
      } catch (err) {
        errorBox.textContent = err.message;
        errorBox.classList.remove('hidden');
      } finally {
        loading.classList.add('hidden');
        submitBtn.disabled = false;
      }
    });

    function parseTags(text) {
      const data = {};
      const lines = text.split('\n');
      let currentTag = null;
      let currentContent = [];

      for (let line of lines) {
        const match = line.match(/^#([A-Z0-9_]+):\s*(.*)$/);
        if (match) {
          if (currentTag) {
            data[currentTag] = currentContent.join('\n').trim();
          }
          currentTag = match[1];
          currentContent = [match[2]];
        } else if (currentTag) {
          currentContent.push(line);
        }
      }
      if (currentTag) {
        data[currentTag] = currentContent.join('\n').trim();
      }
      return data;
    }

    function renderFiche(rawText) {
      const parsed = parseTags(rawText);
      const sheet = document.getElementById('ficheSheet');

      if (!parsed.CLASSE && !parsed.DISCIPLINE) {
        sheet.innerHTML = `<pre class="whitespace-pre-wrap font-sans text-gray-800">${escapeHtml(rawText)}</pre>`;
        return;
      }

      let html = `
        <div class="border-b-2 border-gray-800 pb-4 mb-6">
          <div class="flex justify-between items-center text-sm font-bold text-gray-600 mb-2">
            <span>NIVEAU: ${escapeHtml(parsed.CLASSE || 'CE2')}</span>
            <span>DURÉE: ${escapeHtml(parsed.DUREE || '30 mn')}</span>
            <span>DISCIPLINE: ${escapeHtml(parsed.DISCIPLINE || '')}</span>
          </div>
          <h2 class="text-xl font-bold text-center text-blue-900 uppercase tracking-wide">FICHE PÉDAGOGIQUE</h2>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-3 text-sm mb-6 bg-gray-50 p-4 rounded-lg border border-gray-200">
          <div><strong>Sous-domaine :</strong> ${escapeHtml(parsed.SOUS_DOMAINE || '')}</div>
          <div><strong>Palier :</strong> ${escapeHtml(parsed.PALIER || '')}</div>
          <div class="col-span-1 md:col-span-2"><strong>Compétence de base :</strong> ${escapeHtml(parsed.CB || '')}</div>
          <div class="col-span-1 md:col-span-2"><strong>Objectif d'Apprentissage :</strong> ${escapeHtml(parsed.OA || '')}</div>
          <div class="col-span-1 md:col-span-2"><strong>Objectif Spécifique :</strong> ${escapeHtml(parsed.OS || '')}</div>
          <div class="col-span-1 md:col-span-2"><strong>Contenus :</strong> ${escapeHtml(parsed.CONTENUS || '')}</div>
          <div class="col-span-1 md:col-span-2"><strong>Moyens matériels :</strong> ${escapeHtml(parsed.MOYENS_MATERIELS || '')}</div>
          <div class="col-span-1 md:col-span-2"><strong>Moyens pédagogiques :</strong> ${escapeHtml(parsed.MOYENS_PEDAGOGIQUES || '')}</div>
          <div class="col-span-1 md:col-span-2"><strong>Documentation :</strong> ${escapeHtml(parsed.DOCUMENTATION || '')}</div>
        </div>

        <h3 class="font-bold text-lg text-blue-900 border-b border-blue-900 pb-1 mb-4">DÉROULEMENT DE LA SÉANCE</h3>
        <div class="space-y-4">
      `;

      for (let i = 1; i <= 5; i++) {
        const titre = parsed[`ETAPE${i}_TITRE`];
        const maitre = parsed[`ETAPE${i}_MAITRE`];
        const eleves = parsed[`ETAPE${i}_ELEVES`];

        if (titre || maitre || eleves) {
          html += `
            <div class="border border-gray-200 rounded-lg overflow-hidden">
              <div class="bg-blue-900 text-white font-bold px-4 py-2 text-sm">
                Étape ${i} : ${escapeHtml(titre || '')}
              </div>
              <div class="grid grid-cols-1 md:grid-cols-2 divide-y md:divide-y-0 md:divide-x divide-gray-200 p-3 text-sm gap-2">
                <div>
                  <strong class="text-blue-800 block mb-1">Rôle / Activités du Maître :</strong>
                  <div class="text-gray-700 font-normal leading-relaxed">${formatMarkdown(maitre || '')}</div>
                </div>
                <div>
                  <strong class="text-green-800 block mb-1">Activités des Élèves :</strong>
                  <div class="text-gray-700 font-normal leading-relaxed">${formatMarkdown(eleves || '')}</div>
                </div>
              </div>
            </div>
          `;
        }
      }

      html += `</div>`;
      sheet.innerHTML = html;
      window.lastRawText = rawText;
    }

    function formatMarkdown(str) {
      return escapeHtml(str)
        .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
        .replace(/\*(.*?)\*/g, '<em>$1</em>');
    }

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function copyContent() {
      if (window.lastRawText) {
        navigator.clipboard.writeText(window.lastRawText);
        alert('Contenu copié dans le presse-papier !');
      }
    }
  </script>
</body>
</html>
```
