<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mirass - Générateur Intelligent</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>:root{--bleu:#1E4D8C;--clair:#E8F0FE;--bord:#B8C6DB}body{margin:0;font-family:system-ui;background:var(--clair)}header{background:var(--bleu);color:#fff;padding:22px;text-align:center}.container{max-width:1100px;margin:20px auto;padding:0 12px}.card{background:#fff;border:1px solid var(--bord);border-radius:16px;padding:18px;margin-bottom:16px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}input,select{width:100%;padding:11px;border:1px solid var(--bord);border-radius:10px}button.primary{background:var(--bleu);color:#fff;border:0;padding:11px 16px;border-radius:10px;font-weight:700}table{width:100%;border-collapse:collapse;margin-top:10px}th,td{border:1px solid var(--bord);padding:7px;font-size:13px}th{background:var(--bleu);color:#fff}</style>
</head>
<body>
<header><h1>Mirass — Moteur Intelligent</h1><p>Source unique: ton dépôt Mirass • Mistral réfléchit sur tous tes JSON</p></header>
<div class="container">
<div class="card">
<div class="grid2">
<div><label>Classe / Discipline (libre)</label><input id="classe" placeholder="ex: prehistoire, EDD, grammaire, histoire" value="prehistoire"></div>
<div><label>Niveau</label><select id="niveau"><option>CE2</option><option>CM2</option><option>CE1</option><option>CM1</option><option>Etape 3</option><option>CP</option></select></div>
</div>
<button class="primary" id="btnGen" style="margin-top:12px">Générer avec Mistral Intelligent</button> <span id="status"></span>
<div id="src" style="margin-top:8px;font-size:11px;color:#555"></div>
</div>
<div class="card" id="result" style="display:none">
<h3 id="titre"></h3><p id="meta" style="font-size:12px;color:#666"></p>
<table id="tab"><thead><tr><th>Étape</th><th>Activité maître</th><th>Activité élèves</th><th>Durée</th><th>Matériel</th></tr></thead><tbody></tbody></table>
<button id="btnPdf" style="margin-top:12px">Télécharger PDF tableau</button>
</div>
</div>
<script>
let last=null;
document.getElementById('btnGen').onclick=async()=>{
 const classe=document.getElementById('classe').value, niveau=document.getElementById('niveau').value;
 document.getElementById('status').textContent='Mistral analyse tous tes JSON Mirass...';
 try{
  const r=await fetch('/.netlify/functions/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({classe,niveau})});
  const d=await r.json(); if(!r.ok) throw new Error(d.error);
  last=d.fiche; document.getElementById('src').textContent='Démarche de: '+(d.fiche.demarche_reference||d.source_file)+' | Fichiers utilisés: '+(d.fiche.source_files_utilises||[]).join(', ');
  document.getElementById('titre').textContent=d.fiche.titre; document.getElementById('meta').textContent=(d.fiche.objectif||'')+' | '+ (d.fiche.competences||'');
  const tb=document.querySelector('#tab tbody'); tb.innerHTML='';
  d.fiche.demarche.forEach(x=>{const tr=document.createElement('tr'); tr.innerHTML=`<td>${x.etape}</td><td>${x.activite_maitre}</td><td>${x.activite_eleves}</td><td>${x.duree}</td><td>${x.materiel}</td>`; tb.appendChild(tr)});
  document.getElementById('result').style.display='block'; document.getElementById('status').textContent='Fiche intelligente générée';
 }catch(e){document.getElementById('status').textContent='Erreur: '+e.message}
};
document.getElementById('btnPdf').onclick=()=>{
 if(!last) return; const {jsPDF}=window.jspdf; const doc=new jsPDF('l','mm','a4');
 doc.text(last.titre||'Fiche Mirass',14,14); const rows=last.demarche.map(r=>[r.etape,r.activite_maitre,r.activite_eleves,r.duree,r.materiel]);
 doc.autoTable({startY:20,head:[['Étape','Maître','Élèves','Durée','Matériel']],body:rows}); doc.save((last.titre||'fiche').replace(/\s+/g,'_')+'.pdf');
};
</script>
</body>
</html>
